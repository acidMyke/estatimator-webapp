[project]
name = "application"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "acidMyke", email = "13977709+acidMyke@users.noreply.github.com" },
]
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "greenlet>=3.5.6",
    "httpx2[cli,http2]>=2.16.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.32",
    "ruff>=0.17.1",
    "sqlalchemy[asyncio]>=2.0.54",
    "sqlmodel>=0.0.48",
]

[project.scripts]
application = "application.main:main"
clientgen = "clientgen.main:main"

[project.optional-dependencies]
web = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.143.2",
    "uvicorn[standard]>=0.54.0",
    "pyjwt>=2.15.1",
]
ml = [
    "ipykernel>=7.4.0",
    "joblib>=1.6.0",
    "jupyterlab>=4.6.6",
    "lightgbm>=4.7.0",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "shap>=0.54.1",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
    "openapi-python-client>=0.30.0",
    "ruff>=0.17.1",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["application", "ml", "clientgen", "mailjet_send_client"]

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
ignore = ["EXE002"]

[tool.ruff.lint.isort]
known-first-party = ["application", "mailjet_send_client"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
