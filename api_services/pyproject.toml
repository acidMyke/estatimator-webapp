[project]
name = "api_services"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "acidMyke", email = "13977709+acidMyke@users.noreply.github.com" },
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.143.2",
    "psycopg2-binary>=2.9.13",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0.54",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
api_services = "api_services:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
