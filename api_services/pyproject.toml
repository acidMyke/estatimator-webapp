[project]
name = "api_services"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "acidMyke", email = "13977709+acidMyke@users.noreply.github.com" },
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.143.2",
    "greenlet>=3.5.6",
    "httpx2[cli,http2]>=2.16.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "ruff>=0.17.1",
    "sqlalchemy[asyncio]>=2.0.54",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
api_services = "api_services:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff]
src = ["src"]

[tool.ruff.lint.isort]
known-first-party = ["api_services"]

[dependency-groups]
dev = ["datamodel-code-generator[ruff]>=0.86.0"]

[tool.datamodel-codegen]
formatters = ["ruff-check", "ruff-format"]
target-python-version = "3.14"
include-path-parameters = true
input-file-type = "openapi"
output-model-type = "pydantic_v2.BaseModel"
http-backend = "httpx2"
disable-timestamp = true
use-schema-description = false
use-single-line-docstring = true
strict-nullable = true
use-union-operator = true
use-standard-collections = true
snake-case-field = true
capitalize-enum-members = true
use-serialization-alias = true
field-constraints = true
custom-file-header = "# pyright: reportIncompatibleVariableOverride=false\n# generated by datamodel-codegen, do not edit"

[tool.datamodel-codegen.jobs.mailjet]
input = "openapi/external/mailjet.json"
output = "src/api_services/core/intergration/mailjet/models.py"
openapi-scopes = ["schemas", "api", "parameters", "paths"]
openapi-include-paths = ["/v3.1/send"]
