#cloud-config

package_update: true
package_upgrade: true

groups:
  - docker

users:
  - name: owner
    groups: [docker, sudo]
    shell: /bin/bash
    sudo: 'ALL=(ALL) NOPASSWD:ALL'
    ssh_authorized_keys:
      - ${owner_ssh_public_key}
  - name: deploy
    groups: [docker, sudo]
    shell: /bin/bash
    sudo: 'ALL=(ALL) NOPASSWD:ALL'
    ssh_authorized_keys:
      - ${deploy_ssh_public_key}
  - name: flyio
    groups: [docker]
    shell: /bin/bash
    ssh_authorized_keys:
      - ${flyio_ssh_public_key}

packages:
  - git
  - curl
  - ca-certificates
  - ufw
  - acl

disable_root: true

write_files:
  - path: /etc/ssh/sshd_config.d/00-ssh-hardening.conf
    owner: root:root
    permissions: '0644'
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
      X11Forwarding no
      MaxAuthTries 3

runcmd:
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable
  - sshd -t
  - systemctl reload ssh
  # Docker junk
  - |
    set -e
    install -m 0755 -d /etc/apt/keyrings
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
    chmod a+r /etc/apt/keyrings/docker.asc

    cat > /etc/apt/sources.list.d/docker.sources <<EOF
    Types: deb
    URIs: https://download.docker.com/linux/ubuntu
    Suites: $(. /etc/os-release && echo "$${VERSION_CODENAME}")
    Components: stable
    Architectures: $(dpkg --print-architecture)
    Signed-By: /etc/apt/keyrings/docker.asc
    EOF
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker
  # End of docker junk, clone repo for CI to use
  - |
    install -d -o deploy -g deploy /opt/${github_repo}
    sudo -u deploy -H git clone --branch ${repo_branch} --single-branch https://github.com/${github_owner}/${github_repo}.git /opt/${github_repo}

  - setfacl -R -m u:owner:rX /opt/${github_repo}
  - setfacl -R -d -m u:owner:rX /opt/${github_repo}
  - sudo -u owner -H git config --global --add safe.directory /opt/${github_repo}
