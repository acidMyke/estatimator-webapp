services:
  traefik:
    image: traefik:v3.7
    container_name: traefik
    restart: unless-stopped
    environment:
      - CF_API_EMAIL=${ACME_EMAIL:?}
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN:?}
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/certs:/certs:ro
      - ./infra/dynamic:/dynamic:ro
      - ./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./infra/letsencrypt:/letsencrypt
    command:
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?}"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=${TRAEFIK_DASHBOARD_RULE:?}"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.tls.certresolver=acidmyke"
      - "traefik.http.routers.dashboard.middlewares=dashboard-auth"
      - "traefik.http.middlewares.dashboard-auth.basicauth.users=${TRAEFIK_DASHBOARD_BASIC_AUTH_USERS:?}"
      - "traefik.http.middlewares.dashboard-auth.basicauth.removeheader=true"

  postgis:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      ALEMBIC_PASSWORD: ${ALEMBIC_PASSWORD:?}
      WEBAPI_PASSWORD: ${WEBAPI_PASSWORD:?}
    volumes:
      - ./data/postgis:/var/lib/postgresql/data
      - ./infra/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./infra/postgres/create-roles.sh:/docker-entrypoint-initdb.d/create-roles.sh:ro
    command: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.tcp.routers.postgis.entrypoints=postgres"
      - "traefik.tcp.routers.postgis.rule=${POSTGIS_RULE:?}"
      - "traefik.tcp.routers.postgis.tls=true"
      - "traefik.tcp.routers.postgis.tls.certresolver=acidmyke"
      - "traefik.tcp.services.postgis.loadbalancer.server.port=5432"

networks:
  proxy:
    name: proxy
